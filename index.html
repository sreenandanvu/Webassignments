<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Assignments</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: white;
      padding: 50px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 10px; font-size: 38px; }
    header p { margin: 0; color: #d1d5db; }
    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 { margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }
    .card h3 { margin-top: 0; }
    .card p { color: #6b7280; line-height: 1.5; }
    .button {
      display: inline-block;
      padding: 11px 18px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 8px;
    }
    .button:hover { background: #1d4ed8; }
    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <header>
    <h1>Web Technology Assignments</h1>
    <p>My collection of web development work and assignments</p>
  </header>

  <main>
    <h2>Contents</h2>

    <div class="grid">
      <!-- Add new content cards here -->

      <div class="card">
        <h3>Resume</h3>
        <p>View my resume and personal information.</p>
        <a class="button" href="Resume.html">Open Resume</a>
      </div>

      <!--
      To add another page, create a new HTML file in this repository
      and copy this card format:

      <div class="card">
        <h3>Assignment 2</h3>
        <p>Description of the assignment.</p>
        <a class="button" href="Assignment2.html">Open</a>
      </div>
      -->
    </div>
  </main>

  <footer>
    <p>© 2026 Web Technology</p>
  </footer>

</body>
</html>
